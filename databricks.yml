bundle:
  name: daiwt-03-migration
  databricks_cli_version: '>= 1.25.0'

python:
  resources:
    - 'silver_resources:load_resources'

include: [src/sql/units/*/*.yml, resources/*.yml]

variables:
  silver_bad_rows:
    description: Dev-only synthetic quarantine rows; never enable in production.
    default: "false"
  data_owner:
    default: ${workspace.current_user.userName}
  catalog:
    description: Target Unity Catalog catalog.
  schema_suffix:
    default: ${workspace.current_user.short_name}
  bronze_schema:
    default: bronze_${var.schema_suffix}
  silver_schema:
    default: silver_${var.schema_suffix}
  gold_schema:
    default: gold_${var.schema_suffix}
  warehouse_id:
    default: 6dc4b80538621b7b
  golden_path:
    default: /Volumes/daiwt_03_mig_prod/landing/golden
  job_name_prefix:
    description: Prefix for bundle job names (presets.name_prefix would also rename schemas).
    default: "[${var.schema_suffix}] "

targets:
  dev:
    default: true
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
    presets:
      trigger_pause_status: PAUSED
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev/${var.schema_suffix}
    variables:
      catalog: daiwt_03_mig_dev
    resources:
      schemas:
        bronze:
          name: ${var.bronze_schema}
          catalog_name: ${var.catalog}
          comment: daiwt-03-migration
        silver:
          name: ${var.silver_schema}
          catalog_name: ${var.catalog}
          comment: daiwt-03-migration
        gold:
          name: ${var.gold_schema}
          catalog_name: ${var.catalog}
          comment: daiwt-03-migration
  prod:
    mode: production
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      catalog: daiwt_03_mig_prod
      silver_bad_rows: "false"
      schema_suffix: prod
      job_name_prefix: ""
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
