resources:
  jobs:
    cohort_retention:
      name: ${var.job_name_prefix}cohort_retention
      parameters:
        - name: drop
          default: D0
      tags:
        environment: ${bundle.target}
      tasks:
        - task_key: build_cohort_retention
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./etl.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
        - task_key: build_report
          depends_on:
            - task_key: build_cohort_retention
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./report.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
