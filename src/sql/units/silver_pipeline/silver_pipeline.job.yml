resources:
  jobs:
    silver_pipeline:
      name: ${var.job_name_prefix}silver_pipeline
      parameters:
        - name: drop
          default: D0
      tags:
        environment: ${bundle.target}
      environments:
        - environment_key: parity
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.85,<1
      tasks:
        - task_key: refresh_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver.id}
            full_refresh: true
            parameters:
              drop: "{{job.parameters.drop}}"
        - task_key: verify_silver
          depends_on:
            - task_key: refresh_silver
          environment_key: parity
          spark_python_task:
            python_file: ../../../parity/parity_check.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --suffix
              - ${var.schema_suffix}
              - --drop
              - "{{job.parameters.drop}}"
              - --layer
              - silver
              - --warehouse-id
              - ${var.warehouse_id}
              - --output
              - /tmp/silver-parity.json
