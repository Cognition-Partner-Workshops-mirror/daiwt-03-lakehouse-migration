resources:
  jobs:
    orchestration:
      name: ${var.job_name_prefix}orchestration
      parameters:
        - name: drop
          default: D0
      tags:
        environment: ${bundle.target}
      tasks:
        - task_key: exec_summary
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./etl.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
              drop: "{{job.parameters.drop}}"
        - task_key: report
          depends_on:
            - task_key: exec_summary
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./report.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
              drop: "{{job.parameters.drop}}"
