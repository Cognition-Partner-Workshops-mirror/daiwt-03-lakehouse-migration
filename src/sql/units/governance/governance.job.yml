resources:
  jobs:
    governance:
      name: ${var.job_name_prefix}governance
      parameters:
        - name: drop
          default: D0
      tags:
        environment: ${bundle.target}
      tasks:
        - task_key: apply_governance
          notebook_task:
            notebook_path: ./governance_task.py
            base_parameters:
              action: apply
              bundle_root: ${workspace.file_path}
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              data_owner: ${var.data_owner}
        - task_key: check_governance
          depends_on:
            - task_key: apply_governance
          notebook_task:
            notebook_path: ./governance_task.py
            base_parameters:
              action: check
              bundle_root: ${workspace.file_path}
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              data_owner: ${var.data_owner}
