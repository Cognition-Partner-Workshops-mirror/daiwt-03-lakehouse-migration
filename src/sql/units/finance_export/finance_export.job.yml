variables:
  finance_export_dir:
    description: Volume directory receiving the monthly finance CSV export.
    default: /Volumes/${var.catalog}/${var.gold_schema}/finance_export

resources:
  jobs:
    finance_export:
      name: ${var.job_name_prefix}finance_export
      parameters:
        - name: drop
          default: D0
      tags:
        environment: ${bundle.target}
      tasks:
        - task_key: build_finance_monthly
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./etl.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
        - task_key: build_report
          depends_on:
            - task_key: build_finance_monthly
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./report.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
        - task_key: export_monthly
          depends_on:
            - task_key: build_finance_monthly
          notebook_task:
            notebook_path: ./export.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
              export_dir: ${var.finance_export_dir}

targets:
  prod:
    variables:
      finance_export_dir: /Volumes/${var.catalog}/exports/finance_export
