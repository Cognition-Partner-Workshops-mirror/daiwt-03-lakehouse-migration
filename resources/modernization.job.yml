        - task_key: silver_asof
        - task_key: silver_pipeline
        run_job_task:
          job_id: ${resources.jobs.silver_campaign_touches.id}
          job_parameters:
            drop: '{{job.parameters.drop}}'
      - task_key: attribution
        depends_on:
        - task_key: silver_campaign_touches
        - task_key: verify_silver
        run_job_task:
          job_id: ${resources.jobs.attribution.id}
          job_parameters:
            drop: '{{job.parameters.drop}}'
      - task_key: silver_customers
