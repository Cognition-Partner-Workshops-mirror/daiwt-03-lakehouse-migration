resources:
  jobs:
    modernization:
      name: ${var.job_name_prefix}modernization
      max_concurrent_runs: 1
      parameters:
      - name: drop
        default: D0
      tags:
        environment: ${bundle.target}
      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
      - task_key: bronze_landing
        run_job_task:
          job_id: ${resources.jobs.bronze_landing.id}
          job_parameters:
            drop: '{{job.parameters.drop}}'
      - task_key: silver_asof
        depends_on:
        - task_key: bronze_landing
        run_job_task:
          job_id: ${resources.jobs.silver_asof.id}
          job_parameters:
            drop: '{{job.parameters.drop}}'
      - task_key: silver_pipeline
        depends_on:
