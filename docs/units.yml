  upstream: []
  dialect_notes:
  - Nullable method stays NULL here, scale-2 amount and NTZ paid_ts.
  - Drop DISTKEY/SORTKEY/DISTSTYLE/ENCODE; wall-clock timestamps -> TIMESTAMP_NTZ rendered yyyy-MM-dd HH:mm:ss; CHAR(n) must be rpad-ed (Databricks
    CHAR does not blank-pad); preserve NULLs (no NULL/empty-string coercion).
