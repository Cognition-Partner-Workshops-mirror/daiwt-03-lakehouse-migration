# daiwt_03 migration plan (Redshift -> Databricks), from dbx-understand-legacy-estate.
# One unit per owned target-table group; every output has a golden file under golden_root. Consumed by dbx-migrate-estate.
estate: daiwt_03
legacy_repo: Cognition-Partner-Workshops-mirror/daiwt-03-redshift
source_dialect: redshift
golden_root: /Volumes/daiwt_03_mig_prod/landing/golden
drops:
- D0
reporting_anchor: '2025-12-31'
out_of_scope:
- path: legacy/redshift/units/finance_export/export.sql
  reason: capture_skip; UNLOAD destination and IAM role are placeholders; not run by cmdBuild
- path: legacy/redshift/99_orchestration/refresh_schedule.yaml
  reason: capture_skip; scheduler specification, not installed; load_core uses unsupported --ddl-only; finance_export step not run by cmdBuild
- path: legacy/redshift/00_foundation/01_schemas.sql
  reason: creates source schemas core/mart only; no golden output
units:
- name: silver_customers
  layer: silver
  legacy_job: foundation (load_core)
  legacy_sources:
  - legacy/redshift/00_foundation/02_core_tables.sql
  - legacy/redshift/00_foundation/03_udfs.sql
  outputs:
  - table: silver.customers
    golden: outputs/D0/foundation/customers.csv
    keys:
    - customer_id
    rows: 1500
    legacy_table: core.customers
  reads:
  - bronze.customers
  upstream: []
  dialect_notes:
  - BIGINT id, padded region, raw nullable phone, DATE signup and BOOLEAN is_business.
  - Drop DISTKEY/SORTKEY/DISTSTYLE/ENCODE; wall-clock timestamps -> TIMESTAMP_NTZ rendered yyyy-MM-dd HH:mm:ss; CHAR(n) must be rpad-ed (Databricks
    CHAR does not blank-pad); preserve NULLs (no NULL/empty-string coercion).
- name: silver_stores
  layer: silver
  legacy_job: foundation (load_core)
  legacy_sources:
  - legacy/redshift/00_foundation/02_core_tables.sql
  outputs:
  - table: silver.stores
    golden: outputs/D0/foundation/stores.csv
    keys:
    - store_id
    rows: 40
    legacy_table: core.stores
  reads:
  - bronze.stores
  upstream: []
  dialect_notes:
  - INT id, padded region, state and city strings; no cleansing.
  - Drop DISTKEY/SORTKEY/DISTSTYLE/ENCODE; wall-clock timestamps -> TIMESTAMP_NTZ rendered yyyy-MM-dd HH:mm:ss; CHAR(n) must be rpad-ed (Databricks
    CHAR does not blank-pad); preserve NULLs (no NULL/empty-string coercion).
- name: silver_products
  layer: silver
  legacy_job: foundation (load_core)
  legacy_sources:
  - legacy/redshift/00_foundation/02_core_tables.sql
  outputs:
  - table: silver.products
    golden: outputs/D0/foundation/products.csv
    keys:
    - product_id
    rows: 300
    legacy_table: core.products
  reads:
  - bronze.products
  upstream: []
  dialect_notes:
  - NUMERIC(12,2) price/cost and BOOLEAN active; retain all products.
  - Drop DISTKEY/SORTKEY/DISTSTYLE/ENCODE; wall-clock timestamps -> TIMESTAMP_NTZ rendered yyyy-MM-dd HH:mm:ss; CHAR(n) must be rpad-ed (Databricks
    CHAR does not blank-pad); preserve NULLs (no NULL/empty-string coercion).
- name: silver_orders
  layer: silver
  legacy_job: foundation (load_core)
  legacy_sources:
  - legacy/redshift/00_foundation/02_core_tables.sql
  outputs:
  - table: silver.orders
    golden: outputs/D0/foundation/orders.csv
    keys:
    - order_id
    rows: 20000
    legacy_table: core.orders
  reads:
  - bronze.orders
  upstream: []
  dialect_notes:
  - BIGINT order/customer ids, INT store id, NTZ timestamp; retain every status.
  - Drop DISTKEY/SORTKEY/DISTSTYLE/ENCODE; wall-clock timestamps -> TIMESTAMP_NTZ rendered yyyy-MM-dd HH:mm:ss; CHAR(n) must be rpad-ed (Databricks
    CHAR does not blank-pad); preserve NULLs (no NULL/empty-string coercion).
- name: silver_order_items
