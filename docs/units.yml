  - silver.order_items
  - silver.stores
  upstream:
  - silver_order_items
  - silver_orders
  - silver_stores
  dialect_notes:
  - '`units/store_weekly/etl.sql:8-16`: Monday week start, plus six days for week end; DATEDIFF week counts Monday boundaries from `2025-01-01`,
    not whole elapsed seven-day periods.'
  - '`units/store_weekly/report.sql:3-9`: padded store region and boundary week span plus one, retaining the stores join.'
- name: category_mix
  layer: gold
  legacy_job: category_mix
  legacy_sources:
  - legacy/redshift/units/category_mix/etl.sql
  - legacy/redshift/units/category_mix/report.sql
  outputs:
