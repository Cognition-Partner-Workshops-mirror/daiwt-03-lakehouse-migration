    golden: outputs/D0/foundation/web_events.csv
    keys:
    - event_id
  - table: silver.campaign_touches
    golden: outputs/D0/foundation/campaign_touches.csv
    keys:
    - touch_id
  depends_on: []
  reads: []
  dialect_notes:
  - Keep all ten typed tables as one legacy load_core table group. Drop DISTKEY/SORTKEY/ENCODE. Preserve
    CHAR(4) padding, DECIMAL(12,2), booleans, nullable fields and SUPER as JSON text; no cleansing. Bronze
    inputs are inputs/D0/core.<entity>.csv; framework lands them. UDF expressions are consumed by customer_ltv
    and finance_export.
  - 'Keep exact decimal scales and truncating integer division where used; do not introduce rounding.
    Preserve NULL versus empty string and CHAR padding. Date differences count source calendar boundaries,
    not elapsed durations. Source sessions are UTC: timestamps are timezone-naive; reused output CSV uses
    datetime.isoformat, inputs use YYYY-MM-DD HH:MM:SS[.ffffff]. NULL is \N, never an empty string. Match
    output columns and types from manifest; no nondeterministic columns.'
