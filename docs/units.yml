- name: silver_customers
  layer: silver
  legacy_job: foundation / core.customers
  legacy_sources:
  - legacy/redshift/00_foundation/02_core_tables.sql
  - tools/legacy_redshift.py
  - data/seed/csv/customers.csv
  reads:
  - bronze.customers
  depends_on: []
  outputs:
  - table: silver.customers
    golden: outputs/D0/foundation/customers.csv
    keys:
    - customer_id
    legacy_source: legacy/redshift/00_foundation/02_core_tables.sql
    columns:
    - customer_id
    - email
    - first_name
    - last_name
    - phone
    - region
    - preferred_store_id
    - signup_date
    - is_business
  dialect_notes:
  - Mirror the captured D0 full reload; reporting anchor is 2025-12-31. Preserve source join cardinality and status
    filters exactly.
  - Use fixed-point DECIMAL arithmetic for money. Integer division and integer AVG truncate toward zero; numeric
    AVG retains input scale. Preserve intermediate division scales before multiplying.
  - Preserve NULL versus empty string; CSV NULL token is \N. Keep CHAR(4) region padding and use TIMESTAMP_NTZ rendered
    yyyy-MM-dd HH:mm:ss for golden comparisons.
  - Redshift DISTKEY, SORTKEY, DISTSTYLE and ENCODE have no transformation semantics; do not copy physical DDL clauses.
  - BIGINT id, nullable raw phone, DATE signup, BOOLEAN business flag; right-pad region to four characters.
  - Read the current :drop from landed bronze rows; landing and its metadata are provided by the framework.
