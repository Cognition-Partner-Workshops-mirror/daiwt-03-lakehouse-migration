    - product_id_a
    - product_id_b
    rows: 50
    legacy_table: basket_affinity/report.sql result set
  reads:
  - silver.order_items
  - silver.products
  upstream:
  - silver_order_items
  - silver_products
  dialect_notes:
  - '`units/basket_affinity/etl.sql:7-11`: self-join same order with product b > product a, distinct order count, HAVING count >=5.'
  - '`units/basket_affinity/report.sql:4-10`: two product-name joins, concatenation, descending pair count then ascending product ids, LIMIT 50;
    preserve this total ordering.'
- name: sessionization
  layer: gold
  legacy_job: sessionization
  legacy_sources:
  - legacy/redshift/units/sessionization/etl.sql
  - legacy/redshift/units/sessionization/report.sql
  outputs:
  - table: gold.web_sessions
    golden: outputs/D0/sessionization/web_sessions.csv
    keys:
    - customer_id
    - session_id
    rows: 21280
    legacy_table: mart.web_sessions
  - table: gold.report_sessionization
    golden: outputs/D0/sessionization/report.csv
    keys:
    - customer_id
    rows: 1500
    legacy_table: sessionization/report.sql result set
  reads:
  - silver.web_events
  upstream:
  - silver_web_events
  dialect_notes:
  - '`units/sessionization/etl.sql:12-31`: LAG ordered by event_ts/event_id, strict second-boundary gap >1800, first event starts a session, filter
    NULL customer ids, running SUM with ROWS UNBOUNDED PRECEDING.'
  - '`units/sessionization/etl.sql:34-42` and `units/sessionization/report.sql:2-8`: NTZ session endpoints; report checkout_sessions sums checkout
    events rather than counting sessions containing checkout.'
- name: shipping_sla
  layer: gold
  legacy_job: shipping_sla
  legacy_sources:
  - legacy/redshift/units/shipping_sla/etl.sql
  - legacy/redshift/units/shipping_sla/report.sql
  outputs:
  - table: gold.shipping_sla
    golden: outputs/D0/shipping_sla/shipping_sla.csv
    keys:
    - carrier
    rows: 4
    legacy_table: mart.shipping_sla
  - table: gold.report_shipping_sla
    golden: outputs/D0/shipping_sla/report.csv
    keys:
    - carrier
    rows: 4
    legacy_table: shipping_sla/report.sql result set
  reads:
  - silver.shipments
  upstream:
  - silver_shipments
  dialect_notes:
  - '`units/shipping_sla/etl.sql:7-12`: COUNT(delivered_ts) excludes NULL; undelivered CASE contributes zero. DATEDIFF hour counts crossed hour
    boundaries, including negative intervals. Compute the difference of date-hour indices, not elapsed whole hours. Integer AVG truncates toward
    zero before NUMERIC(10,2) conversion; MAX and <=96 use the same boundary counts.'
  - '`units/shipping_sla/etl.sql:13-14`: CONVERT_TIMEZONE from UTC to America/Los_Angeles is DST-aware over NTZ values; take minimum local delivery
    hour. Report intentionally selects only its listed metrics (`units/shipping_sla/report.sql:2-5`).'
- name: rfm_segments
  layer: gold
  legacy_job: rfm_segments
  legacy_sources:
  - legacy/redshift/units/rfm_segments/etl.sql
  - legacy/redshift/units/rfm_segments/report.sql
  outputs:
  - table: gold.rfm_segments
