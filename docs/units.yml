    to input scale 2. Use decimal ranked endpoints and decimal position arithmetic rather than a DOUBLE percentile followed by rounding. Count
    orders per channel.'
- name: payment_mix
  layer: gold
  legacy_job: payment_mix
  legacy_sources:
  - legacy/redshift/units/payment_mix/etl.sql
