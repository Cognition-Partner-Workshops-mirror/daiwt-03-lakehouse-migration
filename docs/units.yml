  reads:
  - silver.products
  - silver.order_items
  upstream:
  - silver_order_items
  - silver_products
  dialect_notes:
  - '`units/category_mix/etl.sql:7-14`: RATIO_TO_REPORT returns float8; use shared M7''s decimal quotient followed by DOUBLE conversion, returning
    NULL for zero total. Keep revenue itself decimal; publish the share as DOUBLE.'
- name: basket_affinity
  layer: gold
  legacy_job: basket_affinity
  legacy_sources:
  - legacy/redshift/units/basket_affinity/etl.sql
  - legacy/redshift/units/basket_affinity/report.sql
  outputs:
  - table: gold.basket_affinity
