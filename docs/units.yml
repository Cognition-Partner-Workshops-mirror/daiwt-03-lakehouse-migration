  - table: gold.returns_rate
    golden: outputs/D0/returns_rate/returns_rate.csv
    keys:
    - category
    rows: 6
    legacy_table: mart.returns_rate
  - table: gold.report_returns_rate
    golden: outputs/D0/returns_rate/report.csv
    keys:
    - category
    rows: 6
    legacy_table: returns_rate/report.sql result set
  reads:
  - silver.order_items
  - silver.products
  - silver.returns
  upstream:
  - silver_order_items
  - silver_products
