  - table: gold.report_rfm_segments
    golden: outputs/D0/rfm_segments/report.csv
    keys:
    - rfm_segment
    rows: 103
    legacy_table: rfm_segments/report.sql result set
  reads:
  - silver.customers
  - silver.orders
  - silver.order_items
  upstream:
  - silver_customers
  - silver_order_items
  - silver_orders
  dialect_notes:
  - '`units/rfm_segments/etl.sql:10-12,23-25`: anchor recency to `2025-12-31`; LEFT JOIN yields NULL recency but zero frequency/monetary without
    orders. NTILE recency ASC NULLS LAST; frequency/monetary DESC NULLS FIRST; customer_id resolves ties.'
  - '`units/rfm_segments/etl.sql:35` and `units/rfm_segments/report.sql:5`: concatenate three tile digits; report integer AVG frequency truncates.'
- name: promo_lift
  layer: gold
