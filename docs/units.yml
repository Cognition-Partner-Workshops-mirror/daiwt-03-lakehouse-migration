# Golden paths are relative to estate.yml golden_path. D0 only.
estate: daiwt_03
source_dialect: redshift
drops:
- D0
units:
- name: foundation
  layer: silver
  legacy_sources:
  - legacy/redshift/00_foundation/01_schemas.sql
  - legacy/redshift/00_foundation/02_core_tables.sql
  - legacy/redshift/00_foundation/03_udfs.sql
  outputs:
  - table: silver.customers
    golden: outputs/D0/foundation/customers.csv
    keys:
    - customer_id
  - table: silver.stores
    golden: outputs/D0/foundation/stores.csv
    keys:
    - store_id
  - table: silver.products
    golden: outputs/D0/foundation/products.csv
    keys:
    - product_id
  - table: silver.orders
    golden: outputs/D0/foundation/orders.csv
    keys:
    - order_id
  - table: silver.order_items
    golden: outputs/D0/foundation/order_items.csv
    keys:
    - order_item_id
  - table: silver.payments
    golden: outputs/D0/foundation/payments.csv
    keys:
    - payment_id
  - table: silver.returns
    golden: outputs/D0/foundation/returns.csv
    keys:
    - return_id
  - table: silver.shipments
    golden: outputs/D0/foundation/shipments.csv
    keys:
    - shipment_id
