    golden: outputs/D0/foundation/shipments.csv
    keys:
    - shipment_id
    rows: 12817
    legacy_table: core.shipments
  reads:
  - bronze.shipments
  upstream: []
  dialect_notes:
  - Keep ship/delivery timestamps as supplied, including null delivery and negative intervals; shipping_sla consumes them directly.
  - Drop DISTKEY/SORTKEY/DISTSTYLE/ENCODE; wall-clock timestamps -> TIMESTAMP_NTZ rendered yyyy-MM-dd HH:mm:ss; CHAR(n) must be rpad-ed (Databricks
    CHAR does not blank-pad); preserve NULLs (no NULL/empty-string coercion).
- name: silver_web_events
  layer: silver
  legacy_job: foundation (load_core)
  legacy_sources:
  - legacy/redshift/00_foundation/02_core_tables.sql
  outputs:
