- name: daily_revenue
  layer: gold
  legacy_job: daily_revenue
  legacy_sources:
  - legacy/redshift/units/daily_revenue/etl.sql
  - legacy/redshift/units/daily_revenue/report.sql
  outputs:
  - table: gold.daily_revenue
    golden: outputs/D0/daily_revenue/daily_revenue.csv
    keys:
    - order_date
    - sales_channel
    rows: 1460
    legacy_table: mart.daily_revenue
  - table: gold.report_daily_revenue
    golden: outputs/D0/daily_revenue/report.csv
    keys:
    - order_month
    - sales_channel
    rows: 48
    legacy_table: daily_revenue/report.sql result set
  reads:
  - silver.orders
  - silver.order_items
  upstream:
  - silver_order_items
  - silver_orders
  dialect_notes:
  - '`units/daily_revenue/etl.sql:7-13`: truncate timestamps to DATE, count distinct orders per day/channel, sum exact scale-2 line net; inner
    joins and all statuses remain.'
  - '`units/daily_revenue/report.sql:2-8`: month-start DATE aggregation; sum day-level order counts and revenue.'
- name: customer_ltv
  layer: gold
  legacy_job: customer_ltv
  legacy_sources:
  - legacy/redshift/units/customer_ltv/etl.sql
  - legacy/redshift/units/customer_ltv/report.sql
  outputs:
  - table: gold.customer_ltv
    golden: outputs/D0/customer_ltv/customer_ltv.csv
    keys:
    - customer_id
    rows: 1500
    legacy_table: mart.customer_ltv
  - table: gold.report_customer_ltv
    golden: outputs/D0/customer_ltv/report.csv
    keys:
    - region
    rows: 6
    legacy_table: customer_ltv/report.sql result set
  reads:
  - silver.customers
  - silver.orders
  - silver.order_items
  upstream:
  - silver_customers
  - silver_order_items
  - silver_orders
  dialect_notes:
  - '`units/customer_ltv/etl.sql:10-18`: preserve padded region and regex phone; customer-led LEFT JOINs retain customers without orders. LTV
    coalesces to zero; AOV remains NULL without item rows.'
  - '`units/customer_ltv/etl.sql:14`: AOV is average net unit price over item rows, not order totals or quantity-weighted price; numeric AVG truncates
    to scale 2.'
  - '`units/customer_ltv/report.sql:2-9`: group on padded region; truncate AVG(ltv) at scale 2.'
- name: geo_rollup
  layer: gold
  legacy_job: geo_rollup
  legacy_sources:
  - legacy/redshift/units/geo_rollup/etl.sql
  - legacy/redshift/units/geo_rollup/report.sql
  outputs:
  - table: gold.geo_rollup
    golden: outputs/D0/geo_rollup/geo_rollup.csv
    keys:
    - grouping_id
    - region
    - state
    rows: 21
    legacy_table: mart.geo_rollup
  - table: gold.report_geo_rollup
    golden: outputs/D0/geo_rollup/report.csv
    keys:
    - grouping_id
    - region
    - state
    rows: 21
    legacy_table: geo_rollup/report.sql result set
  reads:
  - silver.stores
  - silver.orders
  - silver.order_items
  upstream:
  - silver_order_items
  - silver_orders
  - silver_stores
  dialect_notes:
  - '`units/geo_rollup/etl.sql:5-17`: mirror explicit GROUPING CASE ids and GROUPING SETS, not an engine-generated grouping id. LEFT JOINs retain
    stores; region padding survives; rolled-up columns stay NULL. Composite keys must match NULL as a value.'
- name: churn_flags
  layer: gold
  legacy_job: churn_flags
  legacy_sources:
  - legacy/redshift/units/churn_flags/etl.sql
  - legacy/redshift/units/churn_flags/report.sql
  outputs:
  - table: gold.churn_flags
    golden: outputs/D0/churn_flags/churn_flags.csv
    keys:
    - customer_id
    rows: 1500
    legacy_table: mart.churn_flags
  - table: gold.report_churn_flags
    golden: outputs/D0/churn_flags/report.csv
    keys:
    - churn_flag
    rows: 4
    legacy_table: churn_flags/report.sql result set
  reads:
  - silver.customers
  - silver.orders
  upstream:
  - silver_customers
  - silver_orders
  dialect_notes:
  - '`units/churn_flags/etl.sql:13-53`: plpgsql procedure uses a temporary last-order table and per-customer loop. A set-based rewrite must retain
    all customers, MAX(order_ts)::DATE, and no cross-row state.'
  - '`units/churn_flags/etl.sql:37-45`: literal anchor `2025-12-31`, integer date subtraction, NULL last-order branch, strict >180 and >90 thresholds.'
  - '`units/churn_flags/report.sql:2-7`: integer AVG truncates toward zero; all-null average remains NULL.'
- name: product_perf
  layer: gold
  legacy_job: product_perf
  legacy_sources:
  - legacy/redshift/units/product_perf/etl.sql
  - legacy/redshift/units/product_perf/report.sql
  outputs:
  - table: gold.product_perf
    golden: outputs/D0/product_perf/product_perf.csv
    keys:
    - product_id
    rows: 300
    legacy_table: mart.product_perf
  - table: gold.report_product_perf
    golden: outputs/D0/product_perf/report.csv
    keys:
    - category
    rows: 6
    legacy_table: product_perf/report.sql result set
  reads:
  - silver.products
  - silver.order_items
  - silver.orders
  - silver.stores
  upstream:
  - silver_order_items
  - silver_orders
  - silver_products
  - silver_stores
  dialect_notes:
  - '`units/product_perf/etl.sql:7-26`: region-level sales, ROW_NUMBER ordered by units DESC then region ASC, retain top three. LISTAGG uses that
    same order and removes CHAR trailing padding within concatenated values only.'
  - '`units/product_perf/etl.sql:28-42`: BIGINT units and NUMERIC(18,2) revenue; product-led LEFT JOINs and zero coalescing. Regional calculation
    joins stores/orders; total-sales calculation reads items directly.'
- name: store_weekly
  layer: gold
  legacy_job: store_weekly
  legacy_sources:
  - legacy/redshift/units/store_weekly/etl.sql
  - legacy/redshift/units/store_weekly/report.sql
  outputs:
  - table: gold.store_weekly
