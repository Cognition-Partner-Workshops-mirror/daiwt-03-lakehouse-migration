name: dev-sweep
on:
  workflow_dispatch:
    inputs:
      suffix:
        description: Optional single PR suffix (pr_<n>)
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  id-token: write
concurrency:
  group: dev-sweep
  cancel-in-progress: false
jobs:
  sweep:
    environment: dev
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: databricks/setup-cli@main
      - run: |
          if [ -n "$SUFFIX" ]; then bash ci/sweep_dev.sh --suffix "$SUFFIX"; else bash ci/sweep_dev.sh; fi
        env:
          SUFFIX: ${{ inputs.suffix }}
          GH_TOKEN: ${{ github.token }}
