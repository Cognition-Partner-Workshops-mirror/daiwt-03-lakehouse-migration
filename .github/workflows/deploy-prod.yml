name: deploy-prod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --strict -t prod
      - run: databricks bundle deploy -t prod
      - name: Run production units
        run: python ci/run_units.py prod --target prod
      - name: Production parity
        id: parity
        continue-on-error: true
        run: python src/parity/parity_check.py --catalog daiwt_03_mig_prod --suffix prod
      - name: Render attestation
        if: always()
        id: attest
        continue-on-error: true
        run: python ci/attest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-parity
          path: |
            out/parity.json
            attestation.md
          if-no-files-found: ignore
      - if: always()
        run: |
          if [ -f attestation.md ]; then cat attestation.md >> "$GITHUB_STEP_SUMMARY"; fi
          test '${{ steps.parity.outcome }}' = success
          test '${{ steps.attest.outcome }}' = success
