name: pr
on:
  pull_request:
    branches: [main, pre-migration]
permissions:
  contents: read
  id-token: write
  pull-requests: write
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  dev:
    needs: unit-tests
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: dev
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --strict -t dev --var schema_suffix=pr_${{ github.event.pull_request.number }}
      - name: Verify changed units and parity
        id: verify
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ci/dev_verify.sh pr_${{ github.event.pull_request.number }}
      - name: Render attestation
        if: always()
        id: attest
        continue-on-error: true
        run: python ci/attest.py
      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && hashFiles('attestation.md') != ''
        with:
          header: daiwt-03-parity
          path: attestation.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-evidence
          path: |
            out/parity.json
            attestation.md
          if-no-files-found: ignore
      - if: always()
        run: |
          if [ -f attestation.md ]; then cat attestation.md >> "$GITHUB_STEP_SUMMARY"; fi
          test '${{ steps.verify.outcome }}' = success
          test '${{ steps.attest.outcome }}' = success
